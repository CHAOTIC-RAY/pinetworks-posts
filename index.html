*{box-sizing:border-box;margin:0;}
body{background:#0b0f15;color:#e8edf2;font-family:Inter,Arial,system-ui;padding:26px 20px 60px;}
h1{font-size:26px;letter-spacing:.5px;} h1 b{color:#E8202A;}

.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:18px;}
.gc{background:#11161d;border:1px solid rgba(255,255,255,.07);border-radius:8px;overflow:hidden;display:flex;flex-direction:column;}

.gc img.main{width:100%;display:block;aspect-ratio:4/5;object-fit:cover;}
.gc .cap{font-size:11px;padding:7px 11px;color:#8aa0ad;letter-spacing:1.5px;border-top:1px solid rgba(255,255,255,.06);text-transform:uppercase;}
.gc .meta{padding:12px 13px;}
.gc .ptitle{font-size:15px;font-weight:700;margin-bottom:10px;line-height:1.25;}
.gc .prow{display:flex;gap:8px;align-items:flex-start;margin:9px 0;}
.gc .pl{font-size:10px;letter-spacing:1.5px;text-transform:uppercase;color:#7f93a1;font-weight:700;min-width:84px;padding-top:3px;}
.gc .pv{font-size:13px;line-height:1.55;color:#dfe6ec;flex:1;}
.gc .pv.prompt{font-style:italic;color:#bcd0db;background:#0c1117;border-left:3px solid #E8202A;padding:9px 11px;border-radius:4px;font-size:12.5px;}
.copybtn{margin-top:8px;background:#E8202A;color:#fff;border:0;border-radius:5px;padding:6px 12px;font-size:12px;cursor:pointer;font-weight:700;}
.copybtn.ok{background:#1f8a4c;}
.mb{display:flex;gap:9px;flex-wrap:wrap;margin-top:4px;}
.mb a{display:block;cursor:zoom-in;text-decoration:none;}
.mb img{width:74px;height:56px;object-fit:cover;background:#0c1117;border:1px solid rgba(255,255,255,.1);border-radius:6px;}
.mb .lbl{font-size:9px;color:#81909c;text-align:center;margin-top:2px;max-width:74px;line-height:1.2;}
.lb{position:fixed;inset:0;background:rgba(4,6,10,.92);display:none;align-items:center;justify-content:center;z-index:50;flex-direction:column;padding:24px;}
.lb.on{display:flex;}
.lb img{max-width:92vw;max-height:82vh;border-radius:6px;box-shadow:0 10px 40px rgba(0,0,0,.6);}
.lb .bar{margin-top:14px;display:flex;gap:12px;}
.lb a.dl{background:#E8202A;color:#fff;padding:9px 18px;border-radius:6px;text-decoration:none;font-weight:700;font-size:14px;}
.lb .close{position:absolute;top:18px;right:22px;color:#fff;font-size:30px;cursor:pointer;line-height:1;}
.lb .cap2{color:#cdd8e0;margin-top:10px;font-size:13px;letter-spacing:1px;text-align:center;}
</style></head><body>

const grid=document.getElementById('grid');
CARDS.forEach(c=>{
  const refs=c.mb.map(k=>`<a onclick="openLb('moodboard/${k}.png','${MB[k]} (reference)')"><img src="moodboard/${k}.png" alt="${MB[k]}"><div class="lbl">${MB[k]}</div></a>`).join('');
  const hasPrompt=c.prompt&&c.prompt.length>0;
  const card=document.createElement('div');card.className='gc';
  card.innerHTML=`
    <div class="imgwrap" onclick="openLb('${c.concept}','${c.code} — concept')"><img class="main" src="${c.concept}" alt="${c.code}"></div>

      <div class="ptitle">${c.title}</div>
      ${hasPrompt?`<div class="prow"><div class="pl">Image prompt</div><div class="pv prompt">${c.prompt}</div></div><button class="copybtn" onclick="copyPrompt(this,${JSON.stringify(c.prompt)})">Copy prompt</button>`:`<div class="prow"><div class="pl">Image prompt</div><div class="pv prompt">Use the recommended moodboard direction below as the visual style.</div></div>`}

function openLb(src,cap){document.getElementById('lbimg').src=src;document.getElementById('lbcap').textContent=cap;
  const dl=document.getElementById('lbdl');dl.href=src;dl.setAttribute('download',src.split('/').pop());
  document.getElementById('lb').classList.add('on');}
function closeLb(){document.getElementById('lb').classList.remove('on');}
document.getElementById('lb').addEventListener('click',e=>{if(e.target.id==='lb')closeLb();});
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeLb();});
function copyPrompt(btn,txt){navigator.clipboard.writeText(txt).then(()=>{btn.textContent='Copied ✓';btn.classList.add('ok');setTimeout(()=>{btn.textContent='Copy prompt';btn.classList.remove('ok');},1600);});}
